<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footer Example</title>

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* ===== Footer Style ===== */
    .footer {
      background: linear-gradient(90deg, #007bff, #00bcd4);
      color: #fff;
      text-align: center;
      padding: 40px 20px;
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
      margin-top: 50px;
      box-shadow: 0 -3px 10px rgba(0,0,0,0.2);
    }

    .footer h3 {
      margin-bottom: 15px;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    .footer p {
      margin-bottom: 20px;
      opacity: 0.9;
      font-size: 1rem;
    }

    .footer .social-icons a {
      display: inline-block;
      margin: 0 12px;
      color: #fff;
      font-size: 22px;
      transition: all 0.3s ease;
    }

    .footer .social-icons a:hover {
      color: yellow;
      transform: scale(1.3);
    }

    .footer .copyright {
      margin-top: 25px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      .footer h3 {
        font-size: 1.4rem;
      }
      .footer .social-icons a {
        font-size: 20px;
        margin: 0 10px;
      }
    }
  </style>
</head>

<body>

  <!-- ======= Footer Section ======= -->
  <footer class="footer">
    <h3>PM Smart Institute</h3>
    <p>Learn. Build. Get Placed.</p>

    <div class="social-icons">
      <a href="https://wa.me/918128676273" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
      <a href="https://www.instagram.com/" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://www.facebook.com/" target="_blank" title="Facebook"><i class="fab fa-facebook"></i></a>
      <a href="https://twitter.com/" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a>
    </div>

    <p class="copyright">&copy; <span id="year"></span> PM Smart Institute. All rights reserved.</p>
  </footer>

  <script>
    // Dynamic year
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
